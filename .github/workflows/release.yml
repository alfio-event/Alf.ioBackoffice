name: Release
run-name: Release ${{ inputs.version }} (${{ inputs.platforms }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, e.g. 1.9.5 (release notes are read from fastlane/release-notes)'
        required: true
        type: string
      platforms:
        description: 'Platforms to release'
        required: true
        default: both
        type: choice
        options: [both, ios, android]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the deploy tags

jobs:
  release:
    # macOS runners are free for public repositories; both iOS and Android are built here.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      APPSTORE_API_KEY_PATH: ${{ github.workspace }}/fastlane/keys/appstore_api_key.json
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      SUPPLY_JSON_KEY: ${{ github.workspace }}/fastlane/keys/play_store_key.json
      SUPPLY_PACKAGE_NAME: alfio.scan
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
    steps:
      - name: Check branch
        if: github.ref_name != github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Releases must be built from $DEFAULT_BRANCH, not $REF_NAME"
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # package.json is the source of truth: the input only confirms what is being released
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          declared=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$declared" ]; then
            echo "::error::Requested version $VERSION does not match package.json ($declared). Update package.json on $REF_NAME first."
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: |
          npm ci
          npm install -g nativescript

      - name: Write signing material
        env:
          APPFILE: ${{ secrets.FASTLANE_APPFILE }}
          MATCHFILE: ${{ secrets.FASTLANE_MATCHFILE }}
          APPSTORE_API_KEY_JSON: ${{ secrets.APPSTORE_API_KEY_JSON }}
          IOS_BUILD_XCCONFIG: ${{ secrets.IOS_BUILD_XCCONFIG }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          for name in APPFILE MATCHFILE APPSTORE_API_KEY_JSON IOS_BUILD_XCCONFIG ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PROPERTIES PLAY_STORE_JSON_KEY; do
            [ -n "${!name}" ] || { echo "::error::Missing secret for $name"; exit 1; }
          done
          printf '%s\n' "$APPFILE" > fastlane/Appfile
          printf '%s\n' "$MATCHFILE" > fastlane/Matchfile
          printf '%s' "$APPSTORE_API_KEY_JSON" > "$APPSTORE_API_KEY_PATH"
          printf '%s' "$PLAY_STORE_JSON_KEY" > "$SUPPLY_JSON_KEY"
          printf '\n%s\n' "$IOS_BUILD_XCCONFIG" > fastlane/keys/build.xcconfig
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > App_Resources/Android/keys/alfio.scan.keystore
          printf '%s\n' "$ANDROID_KEYSTORE_PROPERTIES" > App_Resources/Android/keys/keystore.properties

      - name: Release iOS to TestFlight
        id: ios
        if: inputs.platforms != 'android'
        run: bundle exec fastlane ios beta

      - name: Release Android to Play Store (alpha)
        id: android
        if: inputs.platforms != 'ios'
        run: bundle exec fastlane android alpha

      # also runs when only one platform succeeded, so that its upload is recorded
      - name: Tag deploy
        if: always() && (steps.ios.outputs.tag || steps.android.outputs.tag)
        env:
          TAGS: ${{ steps.ios.outputs.tag }} ${{ steps.android.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          refs=()
          for tag in $TAGS; do
            git tag -a "$tag" -m "$tag"
            refs+=("refs/tags/$tag")
          done
          git push --atomic origin "${refs[@]}"

      - name: Remove signing material
        if: always()
        run: |
          rm -f fastlane/Appfile fastlane/Matchfile fastlane/keys/*.json fastlane/keys/build.xcconfig \
                App_Resources/Android/keys/alfio.scan.keystore App_Resources/Android/keys/keystore.properties
